[build-system]
requires = ["setuptools>=77"]  # SPDX-Ausdruck in project.license
build-backend = "setuptools.build_meta"

[project]
name = "hermes-hostd"
version = "0.3.0"
description = "Per-user native CLI PTY daemon for Hermes WebUI"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.scripts]
hermes-hostd = "hostd.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hostd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
